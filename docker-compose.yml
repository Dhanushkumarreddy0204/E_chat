version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: echat_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=EChat
      - API_V1_STR=/api/v1
      - SECRET_KEY=${SECRET_KEY:-echat-production-super-secret-jwt-key-2025}
      - MONGODB_URL=${MONGODB_URL}
      - DATABASE_NAME=${DATABASE_NAME:-EChatCluster}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    networks:
      - echat_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: echat_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - echat_network

networks:
  echat_network:
    driver: bridge
